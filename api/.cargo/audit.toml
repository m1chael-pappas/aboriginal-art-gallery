# cargo-audit reads the whole Cargo.lock, including optional crates that
# are never compiled. Every ignore needs an entry in security/allowlist.md.

[advisories]
ignore = [
  "RUSTSEC-2023-0071",
]
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
deny = ["unsound", "yanked"]
quiet = false
