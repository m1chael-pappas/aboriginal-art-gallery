# cargo-deny policy for the API. Run with: cargo deny check
# Accepted findings and their justification: security/allowlist.md

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses only. Copyleft (GPL, LGPL, AGPL, MPL) is not accepted.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { crate = "openssl", reason = "TLS goes through rustls; a second TLS stack doubles the patching surface" },
  { crate = "openssl-sys", reason = "TLS goes through rustls; a second TLS stack doubles the patching surface" },
  { crate = "native-tls", reason = "TLS goes through rustls; a second TLS stack doubles the patching surface" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
