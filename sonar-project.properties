# SonarQube analysis for the whole monorepo. The Jenkins Code Quality stage
# passes sonar.projectVersion, and the Test and Code Quality stages produce
# the coverage and clippy reports referenced below before the scan runs.
# Quality gate and its thresholds: scripts/jenkins-setup.md#quality-gate

sonar.projectKey=aboriginal-art-gallery
sonar.projectName=Aboriginal Art Gallery
sonar.links.scm=https://github.com/m1chael-pappas/aboriginal-art-gallery
sonar.sourceEncoding=UTF-8

sonar.sources=api/src,web/src,web/index.html
sonar.tests=api/tests,web/src
sonar.test.inclusions=api/tests/**,web/src/**/__tests__/**

# Generated, vendored or build output. generated.ts is produced by
# openapi-typescript from the API spec and is never edited by hand.
sonar.exclusions=\
  web/src/api/generated.ts,\
  web/src/**/__tests__/**,\
  api/migrations/**,\
  api/target/**,\
  api/.sqlx/**,\
  **/node_modules/**,\
  web/dist/**,\
  web/coverage/**,\
  web/reports/**

# Entry points and data fixtures that unit tests do not reach. They are
# exercised by the Deploy stage smoke test instead.
sonar.coverage.exclusions=\
  api/src/main.rs,\
  api/src/bin/**,\
  web/src/main.ts,\
  web/src/App.vue

# The seed binary is a list of curated records with the same shape.
sonar.cpd.exclusions=api/src/bin/seed.rs

# Rust: native analyzer, clippy issues imported from the JSON report the
# pipeline already produced instead of running clippy a second time.
sonar.rust.cargo.manifestPaths=api/Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=reports/clippy.json
sonar.rust.lcov.reportPaths=api/target/lcov.info

# TypeScript and Vue: analysed natively, coverage from vitest.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
