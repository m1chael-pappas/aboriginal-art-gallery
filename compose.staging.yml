name: gallery-staging

services:
  db:
    extends: { file: compose.base.yml, service: db }
    volumes:
      - staging-db:/var/lib/postgresql/data

  api:
    extends: { file: compose.base.yml, service: api }
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  seed:
    extends: { file: compose.base.yml, service: seed }
    depends_on:
      api:
        condition: service_healthy

  web:
    extends: { file: compose.base.yml, service: web }
    ports:
      - "8091:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  staging-db:
